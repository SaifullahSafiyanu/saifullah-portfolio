<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page not found — Saifullah Safiyanu</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<style>
  :root{--bg:#0b0f19;--text:#eef2f8;--muted:#b7c4da;--accent:#5b8cff;--accent2:#43e0c4;--line:#2a3852;--bg2:#131a29}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;
    font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);padding:24px}
  h1{font-size:3rem;margin:0 0 .2em;font-family:'Space Grotesk',system-ui,sans-serif}
  p{color:var(--muted);max-width:420px;margin:0 auto 22px}
  a{display:inline-flex;gap:8px;align-items:center;padding:12px 20px;border-radius:12px;
    background:linear-gradient(120deg,var(--accent),#6f7bff);color:#fff;font-weight:600;text-decoration:none}
  a:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
  .tag{color:var(--accent2);font-size:.8rem;letter-spacing:.15em;text-transform:uppercase}
</style>
</head>
<body>
  <main>
    <p class="tag">Error 404</p>
    <h1>Page not found</h1>
    <p>The page you were looking for isn't here. It may have moved, or the link may be out of date.</p>
    <a href="/">Go to the homepage</a>
  </main>
</body>
</html>
